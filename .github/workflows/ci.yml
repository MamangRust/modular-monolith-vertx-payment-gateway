name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build & Test Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test
        run: mvn -B clean compile

  security-scan:
    name: DevSecOps Security Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
        uses: aquasecurity/trivy-action@0.22.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' 

      - name: Run Trivy Config Scan (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@0.22.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' 

  build-docker:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Docker Images
        run: |
          bash build-docker-images.sh

      - name: Scan Built Image (Auth Service)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'monolith-payment-gateway-grpc-vertx/auth:latest'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Tag and Push to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for service in db-migration auth user card merchant role saldo transaction topup transfer withdraw apigateway email; do
            docker tag monolith-payment-gateway-grpc-vertx/${service}:latest ghcr.io/${IMAGE_OWNER}/vertx-payment-gateway/${service}:latest
            docker push ghcr.io/${IMAGE_OWNER}/vertx-payment-gateway/${service}:latest
          done 
