name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner && github.repository_owner || 'vertx-payment' }}

jobs:
  build:
    name: Build & Test Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test
        run: mvn -B clean verify -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  integration-contracts:
    name: Validate Compose, Kubernetes & Smoke Contracts
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Docker Compose
        run: docker compose -f deployments/local/docker-compose.yml config

      - name: Render Kubernetes manifests
        run: kubectl kustomize deployments/kubernetes/base > /tmp/payment-gateway-manifests.yaml

      - name: Validate smoke script syntax
        run: bash -n deployments/local/smoke.sh

      - name: Validate whitespace
        run: git diff --check

      - name: Upload rendered Kubernetes manifests
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-manifests
          path: /tmp/payment-gateway-manifests.yaml

  security-scan:
    name: DevSecOps Security Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Run Trivy Config Scan (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  build-docker:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: tag
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build All Docker Images
        run: |
          bash build-docker-images.sh

      - name: Scan All Built Images
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.sha_short }}"
          OWNER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          for service in db-migration auth user card merchant role saldo transaction topup transfer withdraw apigateway email; do
            echo "Scanning ${service}..."
            trivy image --severity HIGH,CRITICAL --exit-code 0 \
              monolith-payment-gateway-grpc-vertx/${service}:latest || true
          done

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push to GHCR
        if: github.event_name == 'push'
        run: |
          SHA_TAG="${{ steps.tag.outputs.sha_short }}"
          TS_TAG="${{ steps.tag.outputs.timestamp }}"
          OWNER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          for service in db-migration auth user card merchant role saldo transaction topup transfer withdraw apigateway email; do
            LOCAL_TAG="monolith-payment-gateway-grpc-vertx/${service}:latest"
            REMOTE_BASE="${OWNER}/vertx-payment-gateway/${service}"

            # Push with git SHA tag AND latest
            docker tag ${LOCAL_TAG} ghcr.io/${REMOTE_BASE}:${SHA_TAG}
            docker tag ${LOCAL_TAG} ghcr.io/${REMOTE_BASE}:${TS_TAG}
            docker tag ${LOCAL_TAG} ghcr.io/${REMOTE_BASE}:latest

            docker push ghcr.io/${REMOTE_BASE}:${SHA_TAG}
            docker push ghcr.io/${REMOTE_BASE}:${TS_TAG}
            docker push ghcr.io/${REMOTE_BASE}:latest
          done

      - name: Generate SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/vertx-payment-gateway/apigateway:latest
          format: spdx-json
          output-file: sbom.apigateway.spdx.json

      - name: Upload SBOM Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.*.spdx.json
