apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: payment-gateway
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
  email-service.json: |
