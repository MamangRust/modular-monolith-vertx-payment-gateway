apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: payment-gateway
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.payment-gateway.svc.cluster.local:9093']

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.payment-gateway.svc.cluster.local:8889']

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter.payment-gateway.svc.cluster.local:9308']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.payment-gateway.svc.cluster.local:9100']

      - job_name: 'apigateway-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['apigateway.payment-gateway.svc.cluster.local:8100']
            labels:
              application: 'API Gateway'
              environment: 'production'

      - job_name: 'auth-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['auth.payment-gateway.svc.cluster.local:8081']
            labels:
              application: 'Auth Service'
              environment: 'production'

      - job_name: 'role-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['role.payment-gateway.svc.cluster.local:8082']
            labels:
              application: 'Role Service'
              environment: 'production'

      - job_name: 'user-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['user.payment-gateway.svc.cluster.local:8083']
            labels:
              application: 'User Service'
              environment: 'production'

      - job_name: 'category-service'
