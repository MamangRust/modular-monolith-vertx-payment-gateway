syntax = "proto3";

package pb.card;

option go_package = "github.com/MamangRust/monolith-payment-gateway-pb/card";

import "card/card.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message TriggerBillingRequest {
  int32 billing_cycle_day = 1;
}

message TriggerBillingResponse {
  string status = 1;
  string message = 2;
  int32 statements_generated = 3;
}

message GetStatementRequest {
  string card_number = 1;
  string statement_date = 2; // YYYY-MM-DD
}

message StatementResult {
  int32 statement_id = 1;
  string card_number = 2;
  string statement_date = 3;
  string due_date = 4;
  int64 opening_balance = 5;
  int64 purchases = 6;
  int64 cash_advances = 7;
  int64 payments = 8;
  int64 fees = 9;
  int64 interest_charged = 10;
  int64 closing_balance = 11;
  int64 minimum_payment = 12;
  string payment_status = 13;
}

message GetStatementResponse {
  string status = 1;
  string message = 2;
  StatementResult data = 3;
}

message GetStatementsByCardRequest {
  string card_number = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetStatementsByCardResponse {
  string status = 1;
  string message = 2;
  repeated StatementResult data = 3;
  int32 total = 4;
}

service CardBillingService {
  rpc TriggerBillingCycle(TriggerBillingRequest) returns (TriggerBillingResponse) {}
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse) {}
  rpc GetStatementsByCard(GetStatementsByCardRequest) returns (GetStatementsByCardResponse) {}
}
